mode: citation
result: |-
  else: Deep Learning
  if: Part; Whole
input:
  - id: ITEM-1
    type: article-journal
    title: Deep Learning
  - id: ITEM-2
    type: article-journal
    title: Whole
    part-title: Part
clusters:
  - [{ id: ITEM-1 }]
  - [{ id: ITEM-2 }]
csl: |
  <?xml version="1.0" encoding="utf-8"?>
  <style xmlns="http://purl.org/net/xbiblio/csl" class="note" version="1.0.2" default-locale="en-US">
    <info><id>https://cormacrelf.net/citeproc-rs/test-style</id><title>test-style</title></info>
    <citation>
      <layout>
        <choose>
          <if variable="title part-title">
            <text value="if: " />
            <text variable="part-title" suffix="; " />
            <text variable="title" />
          </if>
          <else>
            <text value="else: " />
            <text variable="title" />
          </else>
        </choose>
      </layout>
    </citation>
  </style>
