name: Test
on:
  pull_request: {}
  push:
    branches:
    - master
    - ci/*

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

# Cancel any in-flight jobs for the same PR/branch so there's only one active
# at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo_test:
    name: Cargo Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check out the citeproc-js fixtures
        run: git submodule update --init --checkout --depth 1 crates/citeproc/tests/data/citeproc-js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pull locales
        run: cargo pull-locales
      # Includes the CSL test-suite and citeproc-js fixtures (tests/suite.rs). Known
      # failures are listed in crates/citeproc/tests/data/expected-failures.
      - run: cargo test

  wasm_tests:
    name: "Test the WASM package"
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup-rust-wasm
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - name: Restore yarn cache
        uses: actions/cache@v2
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Yarn install
        working-directory: crates/wasm/js-tests
        run: yarn install

      - name: Build WASM
        working-directory: crates/wasm/js-tests
        run: yarn build

      - name: Download Firefox ESR from zotero-standalone-build
        working-directory: crates/wasm/js-tests
        run: ./install_firefox.sh

      - name: Run tests, including in Firefox ESR
        working-directory: crates/wasm/js-tests
        run: MUST_RUN_FIREFOX_TESTS=1 yarn test

      # not necessary because we install @citeproc-rs/wasm without yarn knowing now
      # # otherwise, the yarn cache will contain a different @citeproc-rs/wasm
      # # entry every time.
      # - name: Clean yarn cache dir of wasm output
      #   run: |
      #     cd "$(yarn cache dir)"
      #     ls | grep citeproc-rs-wasm | xargs rm -rf

